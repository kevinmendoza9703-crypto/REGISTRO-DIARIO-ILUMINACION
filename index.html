<style>:root{--navy:#1F3864;--navy2:#2c4f8c;--bg:#f2f4f8;--card:#fff;--txt:#1b1f27;--mut:#6b7280;--ok:#16a34a;--bad:#dc2626;--warn:#f59e0b;--line:#e2e6ee;
--gA:#f97316;--gB:#0d9488;--gC:#7c3aed;--gD:#64748b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Arial,Helvetica,sans-serif;font-size:15px}
body{display:flex;flex-direction:column;overscroll-behavior-y:contain}
header{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:20}
header h1{font-size:17px;margin:0;flex:1;line-height:1.15}
header h1 small{display:block;font-size:11px;font-weight:400;opacity:.8}
.hbtn{background:#fff;color:var(--navy);border:0;border-radius:10px;font-weight:700;font-size:13px;padding:9px 11px;min-height:40px}
main{flex:1;overflow-y:auto;padding:10px 10px 90px;-webkit-overflow-scrolling:touch}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:30}
nav button{flex:1;border:0;background:none;padding:8px 2px 7px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px}
nav button .i{font-size:20px;line-height:1}
nav button.on{color:var(--navy);font-weight:700}
nav button.on .i{transform:scale(1.12)}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.bar .d{flex:1;text-align:center;font-weight:700;color:var(--navy)}
.bar .d small{display:block;font-weight:400;color:var(--mut);font-size:11px}
.sq{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:18px;color:var(--navy)}
.prog{height:10px;background:#dfe5f0;border-radius:6px;overflow:hidden;margin:6px 0}
.prog i{display:block;height:100%;background:var(--ok)}
.next{border:2px solid var(--navy);background:#eef3ff}
.next .big{font-size:26px;font-weight:700;color:var(--navy)}
.btn{border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;font-size:15px;padding:13px 16px;min-height:46px}
.btn.alt{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.ok{background:var(--ok)}.btn.red{background:var(--bad)}
.btn.full{width:100%}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.chips{display:flex;gap:6px;margin-bottom:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:7px 12px;font-size:13px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.blk{font-size:12px;font-weight:700;color:var(--navy);margin:12px 4px 5px;letter-spacing:.3px}
.blk.off{color:#b45309}
.ev{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:8px 10px;margin-bottom:6px;border-left:6px solid var(--navy);min-height:58px}
.ev.done{background:#f0fdf4;border-left-color:var(--ok)}
.ev.bad{background:#fef2f2;border-left-color:var(--bad)}
.ev.nxt{outline:2px solid var(--navy)}
.ev .pos{width:30px;text-align:center;font-size:12px;color:var(--mut);font-weight:700}
.ev .mid{flex:1;min-width:0}
.ev .gal{font-size:20px;font-weight:700}
.ev .mv{font-size:12px;color:var(--mut)}
.ev .tm{text-align:right;font-size:12px;color:var(--mut);line-height:1.35;min-width:84px}
.ev .tm b{color:var(--txt);font-size:14px}
.gc{display:inline-block;color:#fff;font-size:11px;font-weight:700;border-radius:9px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.gA{background:var(--gA)}.gB{background:var(--gB)}.gC{background:var(--gC)}.gD{background:var(--gD)}
.now{border:0;background:var(--navy);color:#fff;border-radius:10px;font-weight:700;padding:11px 13px;min-height:44px;font-size:14px}
.chk{width:44px;height:44px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}
.chk.bad{background:var(--bad)}
.empty{text-align:center;color:var(--mut);padding:24px}
/* croquis */
.plan{display:grid;grid-template-columns:repeat(4,1fr) 52px;gap:7px;align-items:stretch}
.sh{position:relative;background:#bdd7ee;border:2px solid #111;border-radius:6px;padding:4px 14px 4px 4px;text-align:center;min-height:72px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.sh .g{font-size:18px;font-weight:700}
.sh .o{font-size:11px;font-weight:700;color:var(--navy)}
.sh .st{font-size:11px;margin-top:2px;height:14px}
.sh .lt{position:absolute;right:0;top:0;bottom:0;width:11px;border-left:2px solid #111}
.sh.full{background:#c6efce}
.tower{grid-column:5;grid-row:1;border:2px solid #111;border-radius:6px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;background:#f2f2f2;padding:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px}
.legend span i{display:inline-block;width:16px;height:12px;border:1px solid #111;vertical-align:-2px;margin-right:4px}
.seq{font-size:12px;color:var(--navy);font-weight:700;line-height:1.5}
/* semana */
.wk{overflow:auto;max-height:calc(100vh - 250px);border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.wk table{border-collapse:separate;border-spacing:0;font-size:12px;min-width:max-content}
.wk th,.wk td{padding:6px 5px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;white-space:nowrap;min-width:52px;background:#fff}
.wk thead th{background:var(--navy);color:#fff;position:sticky;top:0;z-index:2}
.wk thead tr+tr th{top:30px}
.wk .f{position:sticky;left:0;z-index:1;text-align:left;min-width:92px;background:#f8fafc}
.wk thead .f{z-index:3;background:var(--navy)}
.wk td.t{font-weight:700}
.wk td.bad{background:#fecaca;color:#7f1d1d}
.wk td.okc{background:#dcfce7}
/* ajustes */
h3{margin:2px 0 8px;font-size:15px;color:var(--navy)}
label.f{display:block;font-size:12px;color:var(--mut);margin:6px 0 3px}
input[type=time],input[type=number],input[type=text],select,input[type=date]{width:100%;font-size:16px;padding:10px;border:1px solid #cbd2de;border-radius:10px;background:#fff;min-height:44px}
input[type=color]{width:44px;height:40px;padding:0;border:1px solid #cbd2de;border-radius:8px;background:#fff}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.gtitle{font-weight:700;margin:10px 0 2px}
.rt{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.rt .n{width:26px;color:var(--mut);font-size:12px;text-align:center}
.rt .g{flex:1;font-weight:700;font-size:16px}
.rt .m{font-size:12px;color:var(--mut)}
.rt button{width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:16px}
details{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
summary{font-weight:700;color:var(--navy);font-size:15px;min-height:28px}
.shrow{border-top:1px solid var(--line);padding:8px 0}
.lrow{display:grid;grid-template-columns:44px 1fr 90px;gap:8px;align-items:center;margin-bottom:6px}
.note{font-size:12px;color:var(--mut);line-height:1.45}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.sheet h2{margin:0 0 10px;font-size:18px;color:var(--navy)}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#111;color:#fff;border-radius:20px;padding:10px 16px;font-size:13px;z-index:60;max-width:90%}
@media (min-width:700px){main{max-width:720px;margin:0 auto;width:100%}nav{justify-content:center}nav button{max-width:140px}}

.loc{font-size:11px;font-weight:700;white-space:nowrap}.loc.ok{color:var(--ok)}.loc.bad{color:var(--bad)}.loc.warn{color:#b45309}

.who{font-size:11px;color:var(--navy);font-weight:700}
#ubtn{max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:9px 9px}
header h1{min-width:0}

<script>/* ===== CORE: lógica + generador XLSX (sin dependencias) ===== */
(function (root) {
'use strict';
const pad = n => String(n).padStart(2, '0');
const mod = (a, n) => ((a % n) + n) % n;
const toMin = s => { if (s === '' || s == null) return null; const m = /^(\d{1,2}):(\d{2})/.exec(s); return m ? mod(+m[1] * 60 + +m[2], 1440) : null; };
const fmt = m => (m == null ? '' : pad(Math.floor(m / 60)) + ':' + pad(m % 60));
const OPT_ROUTE = [11,15,19,23,27,31,32,33,34,30,26,22,18,14,13,17,21,25,29,28,24,20,16,12];

const galAt = (f, c) => 11 + (f - 1) * 4 + (4 - c);
const arrowTo = (a, b) => fila(b) > fila(a) ? '↓' : fila(b) < fila(a) ? '↑' : col(b) > col(a) ? '→' : '←';
const WORD = { '↓': 'Bajar', '↑': 'Subir', '→': 'Derecha', '←': 'Izquierda' };

/* ---- fechas (YYYY-MM-DD, hora local) ---- */
const ds = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ds(d); };
const mondayOf = s => { const d = pd(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ds(d); };
const serial = s => { const d = pd(s); return Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(1899, 11, 30)) / 86400000); };
const DIAS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const dm = s => { const d = pd(s); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1); };
const dmy = s => { const d = pd(s); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear(); };

/* ---- estado por defecto (según plantilla V6) ---- */
function defaultState() {
  const lotes = [
    { c: 'L26-1', color: '#FF0000', sem: 33 }, { c: 'L26-2', color: '#92D050', sem: 26 },
    { c: 'L25-3', color: '#FFFF00', sem: 75 }, { c: 'L25-5', color: '#00B0F0', sem: 58 },
    { c: 'L25-2', color: '#F8CBAD', sem: 83 }, { c: 'L25-4', color: '#808080', sem: 67 },
    { c: 'VACÍO', color: '#000000', sem: null }];
  const lot = { 14:'L25-4',13:'L25-4',12:'L25-3',11:'VACÍO',18:'L26-1',17:'L26-1',16:'L25-3',15:'L25-2',22:'L25-3',21:'L25-4',20:'L26-1',19:'L26-2',
    26:'L25-3',25:'L26-2',24:'L25-4',23:'L26-2',30:'L25-5',29:'L25-5',28:'L25-5',27:'VACÍO',34:'L25-2',33:'L25-2',32:'L25-2',31:'L25-5' };
  const sheds = {};
  for (let g = 11; g <= 34; g++) sheds[g] = { g: [19, 23, 25].includes(g) ? 'A' : 'B', on: '', off: '', lote: lot[g] };
  return { v: 1, inicio: '20:00', tol: 15, resp: '',
    groups: { A: { on: '22:00', off: '23:30', gap: 0 }, B: { on: '02:00', off: '06:00', gap: 0 }, C: { on: '', off: '', gap: 0 }, D: { on: '', off: '', gap: 0 } },
    sheds, route: OPT_ROUTE.slice(), lotes, reg: {}, geo: { req: false, radius: 40, refs: {} }, turnos: [] };
}
function mergeState(x) {
  const d = defaultState(); if (!x || typeof x !== 'object') return d;
  const o = Object.assign(d, x);
  o.groups = Object.assign(d.groups, x.groups || {});
  o.sheds = Object.assign(d.sheds, x.sheds || {});
  if (!Array.isArray(o.route) || o.route.length !== 24 || new Set(o.route).size !== 24) o.route = OPT_ROUTE.slice();
  if (!Array.isArray(o.lotes) || !o.lotes.length) o.lotes = d.lotes;
  o.reg = x.reg || {};
  o.turnos = Array.isArray(x.turnos) ? x.turnos : [];
  o.geo = Object.assign({ req: false, radius: 40, refs: {} }, x.geo || {}); o.geo.refs = o.geo.refs || {};
  return o;
}

/* ---- horarios programados (igual a Cronograma!E:F) ---- */
function schedule(S) {
  const out = {}, cnt = {};
  for (const g of S.route) {
    const sh = S.sheds[g], gr = S.groups[sh.g] || {};
    const k = cnt[sh.g] = (cnt[sh.g] == null ? 0 : cnt[sh.g] + 1);
    const gap = +gr.gap || 0;
    const own = (v) => toMin(v);
    const grp = (v) => { const m = toMin(v); return m == null ? null : mod(m + k * gap, 1440); };
    const on = own(sh.on) != null ? own(sh.on) : grp(gr.on);
    const off = own(sh.off) != null ? own(sh.off) : grp(gr.off);
    out[g] = { on, off, ownOn: own(sh.on) != null, ownOff: own(sh.off) != null };
  }
  return out;
}
/* ---- orden minuto a minuto (igual a Orden de recorrido) ---- */
function events(S) {
  const sc = schedule(S), ini = toMin(S.inicio) == null ? 1200 : toMin(S.inicio), list = [];
  S.route.forEach((g, i) => {
    if (sc[g].on != null) list.push({ g, k: 'on', min: sc[g].on, off: mod(sc[g].on - ini, 1440), pos: i + 1 });
    if (sc[g].off != null) list.push({ g, k: 'off', min: sc[g].off, off: mod(sc[g].off - ini, 1440), pos: i + 1 });
  });
  list.sort((a, b) => a.off - b.off || (a.k === b.k ? 0 : a.k === 'on' ? -1 : 1) || a.pos - b.pos);
  list.forEach((e, i) => e.n = i + 1);
  return list;
}
function moveText(S, g) {
  const i = S.route.indexOf(g);
  if (i <= 0) return { a: '⌂', t: 'Salir de la torre' };
  const a = arrowTo(S.route[i - 1], g); return { a, t: WORD[a] };
}
function nextArrow(S, g) {
  const i = S.route.indexOf(g);
  if (i === S.route.length - 1) return '→ torre';
  return arrowTo(g, S.route[i + 1]);
}
function nightOf(now, S) {
  const ini = toMin(S.inicio) == null ? 1200 : toMin(S.inicio);
  const cut = ini >= 480 ? ini - 480 : ini;
  const nm = now.getHours() * 60 + now.getMinutes();
  const t = ds(now); return nm < cut ? addDays(t, -1) : t;

const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const dev = (real, prog) => (real == null || prog == null) ? null : mod(real - prog + 720, 1440) - 720;
const getReg = (S, night, g, k) => { const r = S.reg[night] && S.reg[night][g]; return r ? (r[k] || '') : ''; };
function setReg(S, night, g, k, v, loc, man, usr, corr) {
  S.reg[night] = S.reg[night] || {}; const r = S.reg[night][g] = S.reg[night][g] || { on: '', off: '' };

const ADMIN_DEFAULT={user:'kevin',salt:'gx26',hash:'efb39a349a957fcf660cfbcc83a2b219b3078c87ca781a34321063b5e42f6c76'};
const getAdmin=()=>{try{const a=JSON.parse(localStorage.getItem(AKEY));if(a&&a.user&&a.salt&&a.hash)return a;}catch(e){}return ADMIN_DEFAULT;};
let admin=false,lastAct=Date.now();
try{if(sessionStorage.getItem('lg_admin')==='1'&&Date.now()-(+sessionStorage.getItem('lg_t')||0)<IDLE_MS)admin=true;}catch(e){}
const setAdmin=v=>{admin=v;lastAct=Date.now();try{v?sessionStorage.setItem('lg_admin','1'):sessionStorage.removeItem('lg_admin');sessionStorage.setItem('lg_t',String(Date.now()));}catch(e){}};
const touch=()=>{lastAct=Date.now();if(admin)try{sessionStorage.setItem('lg_t',String(lastAct));}catch(e){}};
function lockInfo(){try{return JSON.parse(localStorage.getItem(LKEY))||{n:0,until:0};}catch(e){return{n:0,until:0};}}
function tryLogin(user,pw){
  const L=lockInfo(),now=Date.now();
  if(L.until>now)return{ok:false,msg:'Demasiados intentos. Espera '+Math.ceil((L.until-now)/1000)+' s.'};
  const a=getAdmin();
  if(user.trim().toLowerCase()===a.user&&C.hashPw(a.user,pw,a.salt)===a.hash){try{localStorage.removeItem(LKEY);}catch(e){}setAdmin(true);return{ok:true};}
  L.n=(L.n||0)+1;let msg='Usuario o contraseña incorrectos.';
  if(L.n>=5){L.until=now+60000*Math.min(L.n-4,10);msg='Demasiados intentos. Espera '+Math.ceil((L.until-now)/1000)+' s.';}
  try{localStorage.setItem(LKEY,JSON.stringify(L));}catch(e){}
  return{ok:false,msg};
}
function denied(what){
  const ov=modal(`<h2>🔒 Solo administrador</h2><div class="note" style="margin-bottom:12px">${what}</div><button class="btn full" id="dl">Ingresar como administrador</button><button class="btn alt full" style="margin-top:8px" id="dc">Cerrar</button>`);
  ov.querySelector('#dc').onclick=()=>ov.remove();ov.querySelector('#dl').onclick=()=>{ov.remove();loginModal();};
}
function loginModal(){
  const ov=modal(`<h2>🔒 Ingreso de administrador</h2><label class="f">Usuario</label><input type="text" id="lu" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
    <label class="f">Contraseña</label><input type="password" id="lp" autocomplete="current-password">
    <div id="lm" class="note" style="color:var(--bad);min-height:18px;margin-top:6px"></div>
    <div class="row2" style="margin-top:8px"><button class="btn ok" id="lgo">Ingresar</button><button class="btn alt" id="lcan">Cancelar</button></div>`);
  const go=()=>{const r=tryLogin(ov.querySelector('#lu').value,ov.querySelector('#lp').value);
    if(r.ok){ov.remove();toast('Sesión de administrador iniciada');render(true);}else{ov.querySelector('#lm').textContent=r.msg;ov.querySelector('#lp').value='';}};
  ov.querySelector('#lgo').onclick=go;ov.querySelector('#lcan').onclick=()=>ov.remove();
  ov.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  setTimeout(()=>ov.querySelector('#lu').focus(),50);
}
function adminMenu(){
  const ov=modal(`<h2>🔓 Administrador: ${esc(getAdmin().user)}</h2><div class="note" style="margin-bottom:12px">La sesión se cierra sola tras 10 minutos sin usar la app.</div>
    <button class="btn alt full" id="am1">Cambiar contraseña</button><button class="btn red full" style="margin-top:8px" id="am2">Cerrar sesión</button><button class="btn alt full" style="margin-top:8px" id="am3">Cerrar</button>`);
  ov.querySelector('#am3').onclick=()=>ov.remove();
  ov.querySelector('#am2').onclick=()=>{setAdmin(false);ov.remove();toast('Sesión cerrada');if(tab==='aju')tab='hoy';render();};
  ov.querySelector('#am1').onclick=()=>{ov.remove();pwModal();};
}
function pwModal(){
  const ov=modal(`<h2>Cambiar contraseña</h2><label class="f">Contraseña actual</label><input type="password" id="p0" autocomplete="current-password">
    <label class="f">Nueva contraseña (mínimo 6 caracteres)</label><input type="password" id="p1" autocomplete="new-password">
    <label class="f">Repetir nueva contraseña</label><input type="password" id="p2" autocomplete="new-password">
    <div id="pm" class="note" style="color:var(--bad);min-height:18px;margin-top:6px"></div>
    <div class="row2" style="margin-top:8px"><button class="btn ok" id="psv">Guardar</button><button class="btn alt" id="pcn">Cancelar</button></div>`);
  ov.querySelector('#pcn').onclick=()=>ov.remove();
  ov.querySelector('#psv').onclick=()=>{
    const a=getAdmin(),p0=ov.querySelector('#p0').value,p1=ov.querySelector('#p1').value,p2=ov.querySelector('#p2').value,m=ov.querySelector('#pm');
    if(C.hashPw(a.user,p0,a.salt)!==a.hash){m.textContent='La contraseña actual no es correcta.';return;}
    if(p1.length<6){m.textContent='La nueva contraseña debe tener al menos 6 caracteres.';return;}
    if(p1!==p2){m.textContent='Las contraseñas nuevas no coinciden.';return;}
    const salt=Math.random().toString(36).slice(2,10);
    try{localStorage.setItem(AKEY,JSON.stringify({user:a.user,salt,hash:C.hashPw(a.user,p1,salt)}));}catch(e){m.textContent='No se pudo guardar.';return;}
    ov.remove();toast('Contraseña cambiada');
  };
}

/* ---------- Excel ---------- */
const XLSX_T = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
function xlsxFile() { return new File([C.buildWorkbook(S, night, weekMon)], 'Luces_Galpones_' + night + '.xlsx', { type: XLSX_T }); }
function saveFile(file) {
  const url = URL.createObjectURL(file), a = document.createElement('a');
  a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function downloadXlsx() { saveFile(xlsxFile()); toast('Excel descargado: ' + 'Luces_Galpones_' + night + '.xlsx'); }
async function shareXlsx() {
  const f = xlsxFile();
  try { if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: 'Luces galpones' }); return; } } catch (e) { if (e.name === 'AbortError') return; }
  saveFile(f); toast('Tu navegador no permite compartir; se descargó el archivo.');
}

/* ---------- registro de horas ---------- */
function setTime(g, k, date, v, loc, man, usr, corr) { C.setReg(S, date, g, k, v, loc, man, usr, corr); save(); enqueueReg(date, g, k); }
/* ---------- ubicación (GPS) ---------- */
function getFix() {
  return new Promise(res => {
    if (!navigator.geolocation) return res({ e: 'sin-gps' });
    navigator.geolocation.getCurrentPosition(
      p => res({ la: +p.coords.latitude.toFixed(6), lo: +p.coords.longitude.toFixed(6), ac: Math.round(p.coords.accuracy) }),
      er => res({ e: er.code === 1 ? 'denegado' : er.code === 3 ? 'tiempo' : 'no-disponible' }),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  });
}
const GERR = { 'denegado': 'Permiso de ubicación denegado', 'tiempo': 'No se pudo obtener la ubicación a tiempo', 'no-disponible': 'Ubicación no disponible (activa el GPS)', 'sin-gps': 'Este dispositivo/navegador no permite ubicación' };
let busy = false;
function busyOv(t) { const d = document.createElement('div'); d.className = 'ov'; d.style.alignItems = 'center'; d.style.justifyContent = 'center'; d.innerHTML = '<div class="sheet" style="width:auto;border-radius:16px;text-align:center;padding:22px 26px"><div style="font-size:34px">📍</div><b>' + t + '</b></div>'; document.body.appendChild(d); return d; }
/* Registra la hora de ahora + ubicación. Devuelve true si se guardó. */
async function registerNow(g, k, date) {
  if (!user) { askUser(); return false; }
  if (busy) return false; busy = true;
  const hm = C.nowHM(), ts = Date.now(), ov = busyOv('Obteniendo ubicación…');
  const fix = await getFix(); ov.remove(); busy = false;
  if (fix.e && S.geo.req) { toast('No se registró: ' + (GERR[fix.e] || 'sin ubicación')); return false; }
  setTime(g, k, date, hm, fix.e ? { e: fix.e, t: ts } : { la: fix.la, lo: fix.lo, ac: fix.ac, t: ts }, false, user);
  const ls = C.locStatus(S, date, g, k);
  toast('G' + g + ' ' + kname(k) + ' · ' + hm + (fix.e ? ' · ⚠ sin ubicación' : ls.st === 'far' ? ' · ⚠ lejos del galpón (' + ls.d + ' m)' : ls.st === 'ok' ? ' · 📍 ok' : ' · 📍 guardada'));
  return true;
}
const locTag = ls => {
  const m = ls.manual ? ' <span class="loc warn">✎ manual</span>' : '';
  if (ls.st === 'ok') return '<span class="loc ok">📍 ' + ls.d + ' m</span>' + m;
  if (ls.st === 'far') return '<span class="loc bad">📍 ' + ls.d + ' m ⚠</span>' + m;
  if (ls.st === 'noref') return '<span class="loc ok">📍 ✓</span>' + m;
  if (ls.st === 'noloc') return '<span class="loc bad">sin ubicación</span>' + m;
  return m.trim();
};
const whoTag = (g, k, date) => { const r = S.reg[date] && S.reg[date][g]; if (!r || !r[k]) return ''; const w = r[k + 'U'], c = r[k + 'C'];
  return (w ? '<br><span class="who">👤 ' + esc(w) + '</span>' : '') + (c ? ' <span class="who">✎ corr. ' + esc(c) + '</span>' : ''); };
const mapLink = (g, k, date) => { const L = (C.getReg(S, date, g, k) && S.reg[date][g][k + 'L']); return (admin && L && L.la != null) ? ' · <a href="https://maps.google.com/?q=' + L.la + ',' + L.lo + '" target="_blank" rel="noopener">🗺️ mapa</a>' : ''; };
function editTime(g, k, date) {
  const sc = C.schedule(S)[g], prog = sc[k], cur = C.getReg(S, date, g, k);
  if (cur && !admin) { denied('G' + g + ' ' + kname(k) + ' ya tiene la hora ' + cur + ' registrada. Solo el administrador puede corregirla o borrarla.'); return; }
  const ov = modal(`<h2>G${g} · ${kname(k)}</h2><div class="note" style="margin-bottom:8px">Noche del ${nightLabel(date)} · programado ${C.fmt(prog) || '—'}</div>
    <label class="f">Hora real</label><input type="time" id="tt" value="${cur || C.fmt(prog) || ''}">
    <div class="row2" style="margin-top:12px"><button class="btn ok" id="tsave">Guardar</button><button class="btn alt" id="tnow">Ahora</button></div>
    <div class="row2" style="margin-top:8px">${cur ? '<button class="btn red" id="tdel">Borrar</button>' : ''}<button class="btn alt" id="tcan">Cancelar</button></div>`);
  ov.querySelector('#tsave').onclick = async () => {
    if (C.getReg(S, date, g, k) && !admin) return; const v = ov.querySelector('#tt').value; if (!v) { toast('Escribe una hora'); return; }
    if (cur) { setTime(g, k, date, v, undefined, true, undefined, getAdmin().user); ov.remove(); render(true); toast('Hora corregida (queda marcada como manual)'); return; }   // admin corrige: conserva la ubicación original
    if (!user) { askUser(); return; }
    if (busy) return; busy = true; const ts = Date.now(), o2 = busyOv('Obteniendo ubicación…'); const fix = await getFix(); o2.remove(); busy = false;
    if (fix.e && S.geo.req) { toast('No se registró: ' + (GERR[fix.e] || 'sin ubicación')); return; }
    setTime(g, k, date, v, fix.e ? { e: fix.e, t: ts } : { la: fix.la, lo: fix.lo, ac: fix.ac, t: ts }, true, user); ov.remove(); render(true); toast('Hora guardada (marcada como manual)');
  };
  ov.querySelector('#tnow').onclick = async () => { if (C.getReg(S, date, g, k) && !admin) return; if (cur) { setTime(g, k, date, C.nowHM(), undefined, true, undefined, getAdmin().user); ov.remove(); render(true); return; } ov.remove(); if (await registerNow(g, k, date)) render(true); };
  if (cur) ov.querySelector('#tdel').onclick = () => { if (!admin) return; setTime(g, k, date, ''); ov.remove(); render(true); };
  ov.querySelector('#tcan').onclick = () => ov.remove();
}
async function regNow(g, k) { if (C.getReg(S, night, g, k) && !admin) { denied('Ese registro ya existe. Solo el administrador puede modificarlo.'); return; } if (await registerNow(g, k, night)) render(true); }

/* ---------- barra de noche ---------- */
function nightBar() {
  const t = todayNight();
  return `<div class="bar"><button class="sq" data-act="nprev">◀</button>
    <div class="d">${nightLabel(night)}<small>Noche que empieza ese día${night === t ? ' · HOY' : ''}</small></div>
    <button class="sq" data-act="nnext">▶</button></div>${night !== t ? '<button class="chip" data-act="ntoday" style="margin-bottom:8px">Ir a la noche de hoy</button>' : ''}`;
}
const stat = (g, k) => { const r = C.getReg(S, night, g, k); if (!r) return null; const d = C.dev(C.toMin(r), C.schedule(S)[g][k]); return { r, d, bad: d != null && Math.abs(d) > S.tol, ls: C.locStatus(S, night, g, k) }; };

/* ---------- verificación del recorrido (GPS) ---------- */
function verifCard() {
  const r = C.routeCheck(S, night); if (!r.gps) return '';
  const chip = (n, t, c) => n ? `<span class="loc ${c}" style="margin-right:10px">${t} ${n}</span>` : '';
  const ord = r.ordTot ? Math.round(r.ordOk / r.ordTot * 100) : null;
  return `<div class="card"><b>📍 Verificación del recorrido</b><div style="margin-top:6px">${chip(r.ok, '✔ en el lugar', 'ok')}${chip(r.far, '⚠ lejos del galpón', 'bad')}${chip(r.noloc, '⚠ sin ubicación', 'bad')}${chip(r.noref, '📍 guardadas', 'ok')}${chip(r.manual, '✎ manuales', 'warn')}</div>
    ${ord != null ? `<div class="note" style="margin-top:6px">Orden de la ruta respetado: <b>${r.ordOk} de ${r.ordTot}</b> pasos (${ord}%)</div>` : ''}</div>`;
}

/* ---------- pantalla: Recorrido ---------- */
function screenHoy() {
  const ev = C.events(S), today = night === todayNight();
  const done = ev.filter(e => C.getReg(S, night, e.g, e.k)), next = ev.find(e => !C.getReg(S, night, e.g, e.k));
  let h = nightBar();
  h += `<div class="card"><b>${done.length} de ${ev.length} registros hechos</b><div class="prog"><i style="width:${ev.length ? done.length / ev.length * 100 : 0}%"></i></div>`;
  if (next) h += `<div class="next card" style="margin:8px 0 0"><div class="note">SIGUIENTE (#${next.n})</div><div class="big">G${next.g} · ${kname(next.k)}</div>
     <div class="note">Programado ${C.fmt(next.min)} · ${C.moveText(S, next.g).a} ${C.moveText(S, next.g).t}</div>
     <button class="btn full" style="margin-top:8px" data-act="${today ? 'now' : 'edit'}" data-g="${next.g}" data-k="${next.k}">${today ? 'Registrar ahora (' + C.nowHM() + ')' : 'Registrar hora'}</button></div>`;
  else h += '<div class="note" style="margin-top:6px">✔ Todos los registros de esta noche están completos.</div>';
  h += '</div>';
  h += verifCard();
  h += `<div class="chips"><button class="chip ${filter === 'all' ? 'on' : ''}" data-act="flt" data-v="all">Todos</button><button class="chip ${filter === 'pend' ? 'on' : ''}" data-act="flt" data-v="pend">Pendientes</button></div>`;
  const list = ev.filter(e => filter === 'all' || !C.getReg(S, night, e.g, e.k));
  if (!list.length) h += '<div class="empty">No hay registros pendientes 🎉</div>';
  let prev = null;
  list.forEach((e, i) => {
    if (!prev || prev.k !== e.k || e.off - prev.off > 90) {
      let j = i; while (j + 1 < list.length && list[j + 1].k === e.k && list[j + 1].off - list[j].off <= 90) j++;
      const a = C.fmt(e.min), b = C.fmt(list[j].min);
      h += `<div class="blk ${e.k}">${kname(e.k)} · ${a}${b !== a ? ' → ' + b : ''}</div>`;
    }
    prev = e;
    const s = stat(e.g, e.k), mv = C.moveText(S, e.g), isNext = next && next.n === e.n;
    h += `<div class="ev ${s ? (s.bad ? 'bad' : 'done') : ''} ${isNext ? 'nxt' : ''}" data-act="edit" data-g="${e.g}" data-k="${e.k}" data-n="${e.n}">
      <div class="pos">#${e.pos}</div>
      <div class="mid"><span class="gal">G${e.g}</span><span class="gc g${S.sheds[e.g].g}">${S.sheds[e.g].g}</span><div class="mv">${mv.a} ${mv.t}</div></div>
      <div class="tm">prog <b>${C.fmt(e.min)}</b>${s ? `<br>real <b>${s.r}</b> (${s.d > 0 ? '+' : ''}${s.d} min)<br>${locTag(s.ls)}${whoTag(e.g, e.k, night)}` : ''}</div>
      ${s ? `<div class="chk ${s.bad ? 'bad' : ''}">${s.bad ? '!' : '✔'}</div>` : (today ? `<button class="now" data-act="now" data-g="${e.g}" data-k="${e.k}">Ahora</button>` : '<div style="width:44px"></div>')}</div>`;
  });
  return h;
}

/* ---------- pantalla: Croquis ---------- */
function screenCroquis() {
  let h = nightBar() + '<div class="card"><div class="plan">';
  for (let f = 1; f <= 6; f++) for (let c = 1; c <= 4; c++) {
    const g = C.galAt(f, c), a = stat(g, 'on'), b = stat(g, 'off');
    const mk = (s, t) => s ? `<span style="color:${s.bad ? 'var(--bad)' : ['far', 'noloc'].includes(s.ls.st) ? 'var(--warn)' : 'var(--ok)'};font-weight:700">${t}✓</span>` : `<span style="color:#9ca3af">${t}·</span>`;
    h += `<div class="sh ${a && b ? 'full' : ''}" style="grid-column:${c};grid-row:${f}" data-act="shed" data-g="${g}">
      <div class="g">G${g}</div><div class="o">#${S.route.indexOf(g) + 1} ${C.nextArrow(S, g)}</div><div class="st">${mk(a, 'P')} ${mk(b, 'A')}</div><div class="lt" style="background:${loteColor(g)}"></div></div>`;
  }
  h += '<div class="tower">TORRE<br>inicio y fin</div></div>';
  h += '<div class="note" style="margin-top:8px">Toca un galpón para registrar o ver sus horarios. # = orden en la ruta · flecha = hacia dónde sigue · P/A = prendido/apagado registrado.</div></div>';
  h += '<div class="card"><h3>Lotes</h3><div class="legend">' + S.lotes.map(l => `<span><i style="background:${l.color}"></i>${esc(l.c)}${l.sem != null && l.sem !== '' ? ' · ' + l.sem + ' sem.' : ''}</span>`).join('') + '</div></div>';
  h += '<div class="card"><h3>Secuencia</h3><div class="seq">Torre → ' + S.route.map(g => 'G' + g).join(' → ') + ' → Torre</div></div>';
  return h;
}
function shedModal(g) {
  const sc = C.schedule(S)[g], sh = S.sheds[g], mv = C.moveText(S, g);
  const row = k => { const s = stat(g, k); return `<div class="card" style="margin:0 0 8px;background:#f8fafc"><b>${kname(k)}</b> · prog ${C.fmt(sc[k]) || '—'}${s ? ` · real <b>${s.r}</b> (${s.d > 0 ? '+' : ''}${s.d} min)${s.bad ? ' ⚠' : ''}<br>${locTag(s.ls)}${mapLink(g, k, night)}${whoTag(g, k, night)}` : ''}
    ${s && !admin ? '<div class="note" style="margin-top:6px">🔒 Registro guardado (solo el administrador puede corregirlo)</div>' : `<div class="row2" style="margin-top:8px"><button class="btn ${s ? 'alt' : ''}" data-m="${night === todayNight() ? 'now' : 'edit'}" data-k="${k}">${s ? 'Volver a registrar' : (night === todayNight() ? 'Ahora' : 'Registrar')}</button><button class="btn alt" data-m="edit" data-k="${k}">Editar hora</button></div>`}</div>`; };
  const ov = modal(`<h2>G${g} <span class="gc g${sh.g}">${sh.g}</span></h2><div class="note" style="margin-bottom:10px">Ruta #${S.route.indexOf(g) + 1} · ${mv.a} ${mv.t} · Lote ${esc(sh.lote || '—')}</div>${row('on')}${row('off')}<button class="btn alt full" data-m="close">Cerrar</button>`);
  ov.addEventListener('click', e => {

    else if (m === 'edit') { ov.remove(); editTime(g, k, night); }
  });
}

/* ---------- pantalla: Semana ---------- */
function screenSemana() {
  const sc = C.schedule(S), tol = +S.tol || 0;
  let h = `<div class="bar"><button class="sq" data-act="wprev">◀</button><div class="d">Semana del ${C.dmy(weekMon)}<small>Lunes a domingo (noche que empieza cada día)</small></div><button class="sq" data-act="wnext">▶</button></div>`;
  h += `<div class="row2" style="margin-bottom:10px"><button class="btn" data-act="xls">⬇ Descargar Excel</button><button class="btn alt" data-act="share">📤 Compartir</button></div>`;
  h += '<div class="wk"><table><thead><tr><th class="f" rowspan="2">Galpón</th>';
  for (let d = 0; d < 7; d++) h += `<th colspan="2">${C.DIAS[d].slice(0, 3)} ${C.dm(C.addDays(weekMon, d))}</th>`;
  h += '<th rowspan="2">Noches</th></tr><tr>'; for (let d = 0; d < 7; d++) h += '<th>Pren.</th><th>Apag.</th>'; h += '</tr></thead><tbody>';
  const tot = Array(14).fill(0);
  for (let g = 11; g <= 34; g++) {
    h += `<tr><td class="f"><b>G${g}</b> <span class="gc g${S.sheds[g].g}">${S.sheds[g].g}</span><br><span class="note">${C.fmt(sc[g].on) || '—'} – ${C.fmt(sc[g].off) || '—'}</span></td>`; let full = 0;
    for (let d = 0; d < 7; d++) {
      const dt = C.addDays(weekMon, d); const rr = {};
      ['on', 'off'].forEach((k, i) => { const v = C.getReg(S, dt, g, k), dd = C.dev(C.toMin(v), sc[g][k]), bad = v && dd != null && Math.abs(dd) > tol; if (v) tot[d * 2 + i]++; rr[k] = v;
        h += `<td class="t ${v ? (bad ? 'bad' : 'okc') : ''}" data-act="wedit" data-g="${g}" data-k="${k}" data-d="${dt}">${v || '·'}</td>`; });
      if (rr.on && rr.off) full++;
    }
    h += `<td>${full} / 7</td></tr>`;
  }
  h += '<tr><td class="f"><b>Total</b></td>' + tot.map(n => `<td><b>${n}/24</b></td>`).join('') + '<td></td></tr></tbody></table></div>';
  h += `<div class="note" style="margin-top:8px">Verde = dentro de la tolerancia (${tol} min) · Rojo = fuera de tolerancia · Toca una celda para escribir o corregir la hora.</div>`;
  return h;
}

/* ---------- calibración de ubicaciones (admin) ---------- */
async function calibrate(g) {
  if (busy) return false; busy = true; const o = busyOv('Obteniendo ubicación…'); const f = await getFix(); o.remove(); busy = false;
  if (f.e) { toast(GERR[f.e] || 'Sin ubicación'); return false; }
  if (f.ac > 50 && !confirm('La precisión es baja (±' + f.ac + ' m). ¿Guardar de todos modos?')) return false;
  S.geo.refs[g] = { la: f.la, lo: f.lo, ac: f.ac }; save(); toast('G' + g + ' calibrado (±' + f.ac + ' m)'); return true;
}
function calibModal() {
  let i = S.route.findIndex(g => !S.geo.refs[g]); if (i < 0) i = 0;
  const ov = modal('<div id="cb"></div>'), box = ov.querySelector('#cb');
  const draw = () => {
    const g = S.route[i], f = S.geo.refs[g];
    box.innerHTML = `<h2>Calibrar G${g} <span class="note">(#${i + 1} de 24)</span></h2><div class="note" style="margin-bottom:10px">Párate en el punto donde se registra este galpón (por ejemplo, junto a su puerta) y pulsa <b>Guardar aquí</b>. ${f ? 'Ya tiene referencia; se reemplazará.' : ''}</div>
      <button class="btn ok full" id="cs">📍 Guardar aquí</button><div class="row2" style="margin-top:8px"><button class="btn alt" id="cp">◀ Anterior</button><button class="btn alt" id="cn">Saltar ▶</button></div><button class="btn alt full" style="margin-top:8px" id="cx">Terminar</button>`;
    box.querySelector('#cs').onclick = async () => { if (await calibrate(g)) { if (i >= 23) { ov.remove(); toast('Calibración completa'); render(true); } else { i++; draw(); } } };
    box.querySelector('#cp').onclick = () => { i = Math.max(0, i - 1); draw(); };
    box.querySelector('#cn').onclick = () => { i = Math.min(23, i + 1); draw(); };
    box.querySelector('#cx').onclick = () => { ov.remove(); render(true); };
  };
  draw();
}
async function geoTest() {
  if (busy) return; busy = true; const o = busyOv('Obteniendo ubicación…'); const f = await getFix(); o.remove(); busy = false;
  if (f.e) { modal(`<h2>Ubicación</h2><div class="note">${GERR[f.e] || 'Sin ubicación'}</div>`); return; }
  let best = null; Object.keys(S.geo.refs).forEach(g => { const d = Math.round(C.haversine(f, S.geo.refs[g])); if (!best || d < best.d) best = { g, d }; });
  const ov = modal(`<h2>📍 Mi ubicación</h2><div class="note">Lat ${f.la} · Lon ${f.lo}<br>Precisión ±${f.ac} m</div><div style="margin:10px 0">${best ? `Galpón calibrado más cercano: <b>G${best.g}</b> a <b>${best.d} m</b> ${best.d <= S.geo.radius ? '✔ (dentro del radio)' : '⚠ (fuera del radio de ' + S.geo.radius + ' m)'}` : 'Aún no hay galpones calibrados.'}</div><button class="btn alt full" id="gx">Cerrar</button>`);
  ov.querySelector('#gx').onclick = () => ov.remove();
}
function geoSection() {
  const n = Object.keys(S.geo.refs).length;
  let h = `<details><summary>Ubicación GPS (${n}/24 calibrados)</summary><div class="note" style="margin:6px 0">Cada registro guarda dónde estaba el celular. Para saber si está en el galpón correcto, calibra un punto de referencia por galpón.</div>
    <div class="row2"><div><label class="f">Radio permitido (m)</label><input type="number" inputmode="numeric" min="5" data-f="georad" value="${S.geo.radius}"></div>
    <div><label class="f">Exigir ubicación</label><select data-f="georeq"><option value="0" ${!S.geo.req ? 'selected' : ''}>No (solo marca)</option><option value="1" ${S.geo.req ? 'selected' : ''}>Sí (no deja registrar sin GPS)</option></select></div></div>
    <button class="btn full" style="margin-top:10px" data-act="geocal">📍 Calibrar recorriendo la ruta</button>
    <button class="btn alt full" style="margin-top:8px" data-act="geotest">Probar mi ubicación ahora</button><div style="margin-top:8px">`;
  S.route.forEach(g => { const f = S.geo.refs[g];
    h += `<div class="rt"><div class="g">G${g}</div><div class="m" style="flex:1">${f ? f.la.toFixed(5) + ', ' + f.lo.toFixed(5) + (f.ac ? ' (±' + f.ac + ' m)' : '') : 'sin calibrar'}</div><button style="width:auto;padding:0 10px;font-size:13px" data-act="geosave" data-g="${g}">Guardar aquí</button>${f ? `<button data-act="geoclr" data-g="${g}">✕</button>` : ''}</div>`; });
  return h + '</div></details>';
}

/* ---------- pantalla: Ajustes ---------- */
function screenAjustes() {
  let h = '';
  if (!admin) {
    h += `<div class="card"><h3>👤 Usuario actual</h3><div style="font-size:18px;font-weight:700;color:var(--navy);margin-bottom:8px">${esc(user) || '—'}</div><button class="btn alt full" data-act="chuser">Cambiar de usuario</button></div>`;
    h += `<div class="card"><h3>🔒 Modo operador</h3><div class="note" style="margin-bottom:10px">Puedes registrar las horas de prender y apagar. Los horarios, la ruta, los lotes y los datos solo los puede cambiar el administrador.</div><div class="note" style="margin-bottom:10px">📍 Al registrar una hora, la app guarda también la ubicación del celular en ese momento. No se rastrea de forma continua.</div><button class="btn full" data-act="login">Ingresar como administrador</button></div>`;
    if (syncOn()) h += `<div class="card"><h3>☁ Drive</h3><div class="note" style="margin-bottom:8px">Estado: <span id="sst">${syncStatusHtml()}</span></div><button class="btn alt full" data-act="sysync">Sincronizar ahora</button></div>`;
    if (installEvt) h += '<div class="card"><h3>Instalar en este celular</h3><button class="btn full" data-act="install">📲 Instalar la app</button></div>';
    h += `<div class="card"><h3>Descargar</h3><div class="row2"><button class="btn" data-act="xls">⬇ Excel</button><button class="btn alt" data-act="share">📤 Compartir</button></div></div>`;
    return h;
  }
  h += `<div class="card" style="background:#ecfdf5"><b>🔓 Administrador: ${esc(getAdmin().user)}</b><div class="row2" style="margin-top:8px"><button class="btn alt" data-act="chpw">Cambiar contraseña</button><button class="btn red" data-act="logout">Cerrar sesión</button></div></div>`;
  if (installEvt) h += '<div class="card"><h3>Instalar en este celular</h3><button class="btn full" data-act="install">📲 Instalar la app</button></div>';
  h += `<div class="card"><h3>General</h3><div class="g3"><div><label class="f">Inicio del gráfico</label><input type="time" data-f="inicio" value="${S.inicio}"></div>
    <div><label class="f">Tolerancia (min)</label><input type="number" inputmode="numeric" min="0" data-f="tol" value="${S.tol}"></div>
    <div><label class="f">Responsable</label><input type="text" data-f="resp" value="${esc(S.resp)}"></div></div></div>`;
  h += '<details open><summary>Horario de cada grupo</summary>';
  ['A', 'B', 'C', 'D'].forEach(k => { const g = S.groups[k];
    h += `<div class="gtitle"><span class="gc g${k}">${k}</span> Grupo ${k}</div><div class="g3"><div><label class="f">Prender</label><input type="time" data-f="grp" data-grp="${k}" data-p="on" value="${g.on}"></div>
    <div><label class="f">Apagar</label><input type="time" data-f="grp" data-grp="${k}" data-p="off" value="${g.off}"></div>
    <div><label class="f">Min. entre galpones</label><input type="number" inputmode="numeric" min="0" data-f="grp" data-grp="${k}" data-p="gap" value="${g.gap || 0}"></div></div>`; });
  h += '<div class="note" style="margin-top:8px">Min. entre galpones: 0 = todos a la misma hora; 1 = el primer galpón de la ruta a la hora indicada, el siguiente 1 minuto después, etc. Deja vacío un grupo para que sus galpones no se prendan.</div></details>';
  h += syncSection();
  h += `<details><summary>Turnos recientes (${S.turnos.length})</summary><div class="note" style="margin:6px 0">Quién abrió la app e inició la labor. Cada registro de hora guarda además el nombre de quien lo hizo.</div>`
    + (S.turnos.slice(-25).reverse().map(t => { const d = new Date(t.t); return `<div class="rt"><div class="g" style="font-size:15px">${esc(t.u)}</div><div class="m">${C.dm(C.ds(d))} ${pad2(d.getHours())}:${pad2(d.getMinutes())}</div></div>`; }).join('') || '<div class="note">Aún no hay turnos.</div>') + '</details>';
  h += geoSection();
  h += '<details><summary>Ruta de recorrido</summary><div class="note" style="margin:6px 0">Sale de la torre (junto a G11). Usa ▲ ▼ para cambiar el orden; el croquis, el orden y los horarios escalonados se actualizan solos.</div>';
  S.route.forEach((g, i) => { const mv = C.moveText(S, g);
    h += `<div class="rt"><div class="n">#${i + 1}</div><div class="g">G${g}</div><div class="m">${mv.a} ${mv.t}</div><button data-act="up" data-i="${i}" ${i === 0 ? 'disabled' : ''}>▲</button><button data-act="down" data-i="${i}" ${i === 23 ? 'disabled' : ''}>▼</button></div>`; });
  h += '<button class="btn alt full" style="margin-top:10px" data-act="rroute">Restablecer ruta recomendada (lazo cerrado)</button></details>';
  h += '<details><summary>Galpones (grupo, horario propio y lote)</summary><div class="note" style="margin:6px 0">Horario propio vacío = usa el de su grupo.</div>';
  for (let g = 11; g <= 34; g++) { const s = S.sheds[g];
    h += `<div class="shrow"><b>G${g}</b><div class="g3"><div><label class="f">Grupo</label><select data-f="shed" data-g="${g}" data-p="g">${['A', 'B', 'C', 'D'].map(k => `<option ${s.g === k ? 'selected' : ''}>${k}</option>`).join('')}</select></div>
      <div><label class="f">Prende propio</label><input type="time" data-f="shed" data-g="${g}" data-p="on" value="${s.on}"></div><div><label class="f">Apaga propio</label><input type="time" data-f="shed" data-g="${g}" data-p="off" value="${s.off}"></div></div>
      <label class="f">Lote</label><select data-f="shed" data-g="${g}" data-p="lote">${S.lotes.map(l => `<option ${s.lote === l.c ? 'selected' : ''}>${esc(l.c)}</option>`).join('')}</select></div>`; }
  h += '</details>';
  h += '<details><summary>Lotes (color y semanas)</summary>';
  S.lotes.forEach((l, i) => { h += `<div class="lrow"><input type="color" data-f="lote" data-i="${i}" data-p="color" value="${l.color}"><input type="text" data-f="lote" data-i="${i}" data-p="c" value="${esc(l.c)}"><input type="number" inputmode="numeric" placeholder="sem." data-f="lote" data-i="${i}" data-p="sem" value="${l.sem == null ? '' : l.sem}"></div>`; });
  h += '</details>';
  h += `<div class="card"><h3>Datos</h3><div class="row2"><button class="btn" data-act="xls">⬇ Excel</button><button class="btn alt" data-act="share">📤 Compartir</button></div>
    <div class="row2" style="margin-top:8px"><button class="btn alt" data-act="bk">Respaldo (.json)</button><button class="btn alt" data-act="rs">Restaurar respaldo</button></div>
    <input type="file" id="rsf" accept=".json,application/json" style="display:none">
    <button class="btn red full" style="margin-top:8px" data-act="clr">Borrar todos los registros</button>
    <div class="note" style="margin-top:8px">Los datos se guardan solo en este celular. Haz un respaldo de vez en cuando.</div></div>`;
  h += `<div class="card"><h3>Cómo instalar en Android</h3><div class="note">1) Abre la app en Chrome.<br>2) Menú ⋮ → <b>Instalar app</b> o <b>Añadir a pantalla de inicio</b>.<br>3) Se abre como una app normal y funciona sin internet.</div></div>`;
  return h;
}

/* ---------- render ---------- */
const TITLES = { hoy: ['Recorrido', 'Registro minuto a minuto'], croq: ['Croquis', 'Ubicación de galpones y ruta'], sem: ['Semana', 'Registro semanal'], aju: ['Ajustes', 'Horarios, ruta y datos'] };
function render(keepScroll) {
  const m = $('main'), y = m.scrollTop, prevOpen = keepScroll ? [...m.querySelectorAll('details')].map(d => d.open) : null;
  m.innerHTML = { hoy: screenHoy, croq: screenCroquis, sem: screenSemana, aju: screenAjustes }[tab]();
  if (prevOpen && prevOpen.length) m.querySelectorAll('details').forEach((d, i) => { if (i < prevOpen.length) d.open = prevOpen[i]; });
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const ub = $('#ubtn'); ub.textContent = '👤 ' + (user || '—');
  const ab = $('#abtn'); ab.textContent = admin ? '🔓 ' + getAdmin().user : '🔒'; ab.setAttribute('aria-label', admin ? 'Administrador' : 'Ingresar como administrador');
  $('#ttl').innerHTML = TITLES[tab][0] + '<small>' + TITLES[tab][1] + '<span id="sb">' + (syncOn() ? ' · ' + esc(syncBadge()) : '') + '</span></small>';
  if (keepScroll) m.scrollTop = y;
  else if (tab === 'hoy') { const n = m.querySelector('.ev.nxt'); if (n) n.scrollIntoView({ block: 'center' }); }
}

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const nb = e.target.closest('nav button'); if (nb) { tab = nb.dataset.tab; render(); return; }
  const el = e.target.closest('[data-act]'); if (!el || !el.closest('main, header')) return;
  const a = el.dataset.act, g = +el.dataset.g, k = el.dataset.k;
  if (['up', 'down', 'rroute', 'bk', 'rs', 'clr', 'geocal', 'geosave', 'geoclr', 'geotest', 'sytest', 'syall', 'sylink'].includes(a) && !admin) { denied('Esta acción es solo para el administrador.'); return; }
  if (a === 'chuser') askUser(true);
  else if (a === 'sysync') { toast('Sincronizando…'); flush(true).then(ok => { toast(ok ? '✔ Sincronizado' : '⚠ ' + (Q.err || 'sin conexión')); if (ok) render(true); }); }
  else if (a === 'sytest') syTest();
  else if (a === 'syall') { if (!syncOn()) toast('Primero escribe la dirección y la clave'); else { enqueueAll(); toast('Enviando todo a Drive…'); flush(true).then(ok => toast(ok ? '✔ Datos enviados a Drive' : '⚠ ' + (Q.err || 'sin conexión'))); } }
  else if (a === 'sylink') syLink();
  else if (a === 'login') loginModal();
  else if (a === 'logout') { setAdmin(false); toast('Sesión cerrada'); tab = 'hoy'; render(); }
  else if (a === 'chpw') pwModal();
  else if (a === 'geocal') calibModal();
  else if (a === 'geotest') geoTest();
  else if (a === 'geosave') calibrate(g).then(ok => ok && render(true));
  else if (a === 'geoclr') { delete S.geo.refs[g]; save(); render(true); }
  else if (a === 'now') regNow(g, k);
  else if (a === 'edit') editTime(g, k, night);
  else if (a === 'wedit') editTime(g, k, el.dataset.d);
  else if (a === 'shed') shedModal(g);
  else if (a === 'nprev') { night = C.addDays(night, -1); weekMon = C.mondayOf(night); render(); }
  else if (a === 'nnext') { night = C.addDays(night, 1); weekMon = C.mondayOf(night); render(); }
  else if (a === 'ntoday') { night = todayNight(); weekMon = C.mondayOf(night); render(); }
  else if (a === 'wprev') { weekMon = C.addDays(weekMon, -7); render(true); }
  else if (a === 'wnext') { weekMon = C.addDays(weekMon, 7); render(true); }
  else if (a === 'flt') { filter = el.dataset.v; render(true); }
  else if (a === 'xls') downloadXlsx();
  else if (a === 'share') shareXlsx();
  else if (a === 'up' || a === 'down') { const i = +el.dataset.i, j = a === 'up' ? i - 1 : i + 1; [S.route[i], S.route[j]] = [S.route[j], S.route[i]]; save(); render(true); }
  else if (a === 'rroute') { if (confirm('¿Volver a la ruta recomendada?')) { S.route = C.OPT_ROUTE.slice(); save(); render(true); } }
  else if (a === 'install' && installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(true); }); }
  else if (a === 'bk') { saveFile(new File([JSON.stringify(S)], 'respaldo_luces_galpones_' + C.ds(new Date()) + '.json', { type: 'application/json' })); toast('Respaldo descargado'); }
  else if (a === 'rs') $('#rsf').click();
  else if (a === 'clr') { if (confirm('¿Borrar TODOS los registros de horas? No se puede deshacer.')) { const del = []; Object.keys(S.reg).forEach(n => Object.keys(S.reg[n]).forEach(g => ['on', 'off'].forEach(k => { if (S.reg[n][g][k]) del.push([n, g, k]); }))); S.reg = {}; save(); del.forEach(d => enqueueReg(d[0], d[1], d[2])); render(true); toast('Registros borrados'); } }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (!admin && (t.id === 'rsf' || t.dataset.f)) { t.value = ''; denied('Los cambios de configuración son solo para el administrador.'); return; }
  if (t.id === 'rsf') { const f = t.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { S = C.mergeState(JSON.parse(r.result)); save(); if (syncOn()) { enqueueAll(); scheduleFlush(1500); } render(); toast('Respaldo restaurado'); } catch (x) { toast('Archivo no válido'); } }; r.readAsText(f); return; }
  const f = t.dataset.f; if (!f) return; const v = t.value;
  if (f === 'inicio') { if (v) S.inicio = v; }
  else if (f === 'tol') S.tol = Math.max(0, +v || 0);
  else if (f === 'georad') S.geo.radius = Math.max(5, +v || 40);
  else if (f === 'georeq') S.geo.req = v === '1';
  else if (f === 'resp') S.resp = v;
  else if (f === 'syurl') { SY.url = v.trim(); saveSY(); renderBadge(); return; }
  else if (f === 'sykey') { SY.key = v.trim(); saveSY(); renderBadge(); return; }
  else if (f === 'grp') S.groups[t.dataset.grp][t.dataset.p] = t.dataset.p === 'gap' ? Math.max(0, +v || 0) : v;
  else if (f === 'shed') S.sheds[+t.dataset.g][t.dataset.p] = v;
  else if (f === 'lote') { const l = S.lotes[+t.dataset.i], p = t.dataset.p;
    if (p === 'c') { const old = l.c, nv = v.trim() || old; Object.values(S.sheds).forEach(s => { if (s.lote === old) s.lote = nv; }); l.c = nv; }
    else if (p === 'sem') l.sem = v === '' ? null : +v; else l[p] = v; }
  save();
});
$('#xbtn').addEventListener('click', downloadXlsx);
$('#abtn').addEventListener('click', () => (admin ? adminMenu() : loginModal()));
$('#ubtn').addEventListener('click', () => (user ? userMenu() : askUser()));
['click', 'touchstart', 'keydown'].forEach(ev => document.addEventListener(ev, touch, { passive: true }));
setInterval(() => { if (admin && Date.now() - lastAct > IDLE_MS) { setAdmin(false); toast('Sesión de administrador cerrada por inactividad'); if (tab === 'aju') tab = 'hoy'; render(true); } }, 20000);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (tab === 'aju') render(true); });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
readHashConfig();
render();
if (!user) askUser();
window.addEventListener('online', () => flush());
window.addEventListener('offline', renderBadge);
document.addEventListener('visibilitychange', () => { if (!document.hidden) flush(); });
setInterval(() => { if (!document.hidden) flush(); }, 30000);
if (syncOn()) setTimeout(() => flush(), 800);
})();
</script>
</body></html>
